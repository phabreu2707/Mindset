<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Foco Calmo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 300px;
      margin: 0;
      padding: 16px;

      background: #f4f2ed;
      color: #262626;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    h1 {
      margin:
        0 0 4px;

      font-size:
        18px;
    }

    .descricao {
      margin:
        0 0 16px;

      color:
        #555;

      font-size:
        12px;

      line-height:
        1.4;
    }

    .opcao {
      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      padding:
        9px 0;

      font-size:
        14px;
    }

    .opcao input {
      width:
        18px;

      height:
        18px;
    }

    .grupo {
      margin-top:
        14px;

      padding-top:
        12px;

      border-top:
        1px solid #d5d2ca;
    }

    .grupo strong {
      display:
        block;

      margin-bottom:
        8px;

      font-size:
        13px;
    }

    .linha-timer {
      display:
        flex;

      gap:
        8px;
    }

    select,
    button {
      min-height:
        36px;

      border:
        1px solid #c8c5bd;

      border-radius:
        8px;

      background:
        #fff;

      color:
        #262626;

      font-family:
        inherit;
    }

    select {
      flex:
        1;

      padding:
        0 8px;
    }

    button {
      padding:
        0 12px;

      cursor:
        pointer;
    }

    button:hover {
      background:
        #eeeae2;
    }

    #status {
      min-height:
        18px;

      margin-top:
        12px;

      font-size:
        12px;

      color:
        #555;
    }
  </style>
</head>

<body>

  <h1>Foco Calmo</h1>

  <p class="descricao">
    Menos distrações, leitura mais confortável
    e uma página mais tranquila.
  </p>

  <label class="opcao">
    <input
      type="checkbox"
      id="modoCalmo"
    >

    <span>
      Modo Calmo
    </span>
  </label>

  <label class="opcao">
    <input
      type="checkbox"
      id="fonteLegivel"
    >

    <span>
      Fonte legível
    </span>
  </label>

  <label class="opcao">
    <input
      type="checkbox"
      id="coresSuaves"
    >

    <span>
      Cores suaves
    </span>
  </label>

  <label class="opcao">
    <input
      type="checkbox"
      id="esconderDistracoes"
    >

    <span>
      Esconder anúncios e distrações
    </span>
  </label>

  <div class="grupo">

    <strong>
      Timer de foco
    </strong>

    <div class="linha-timer">

      <select id="tempoFoco">

        <option value="300">
          5 minutos
        </option>

        <option value="900">
          15 minutos
        </option>

        <option value="1800">
          30 minutos
        </option>

        <option value="2700">
          45 minutos
        </option>

        <option value="3600">
          60 minutos
        </option>

      </select>

      <button
        id="iniciarTimer"
        type="button"
      >
        Iniciar
      </button>

    </div>

  </div>

  <div
    id="status"
    role="status"
    aria-live="polite"
  ></div>

  <script src="popup.js"></script>

</body>

</html>
